[package]
name = "nagomi-native"
version = "0.1.0"
edition = "2021"
description = "Native Rust port of the nagomi koi pond, as a live wallpaper"
license-file = "LICENSE"
repository = "https://github.com/Beirun/nagomi-rust"
readme = "README.md"
keywords = ["wallpaper", "wgpu", "wayland", "koi", "simulation"]
categories = ["graphics"]

[dependencies]
wgpu = "30"
raw-window-handle = "0.6"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
log = "0.4"
env_logger = "0.11"

[target.'cfg(unix)'.dependencies]
smithay-client-toolkit = { version = "0.21", features = ["calloop"] }
wayland-client = { version = "0.31", features = ["system", "libwayland_1_23"] }
calloop = "0.14"

[profile.release]
opt-level = 2

[target.'cfg(windows)'.dependencies]
winit = "0.30"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }
